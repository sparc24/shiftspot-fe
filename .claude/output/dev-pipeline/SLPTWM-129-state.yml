testPlan: |
  - workerApi request mapping: phone->phoneNumber rename, skill id->Title-Case label mapping, numeric age passthrough.
  - workerApi response mapping: tolerant fallback to submitted payload for empty/partial/null DTO fields, empty-string name handling, missing id->''.
  - 409 duplicate detection ladder: email/phone/mobile/contact-number keyword matching, both-fields match, indeterminate fallback (flags both).
  - 400 and network errors pass through unchanged, never treated as duplicates.
  - client.ts interceptor: RFC7807 detail/title normalization, legacy code/message back-compat, status population, non-JSON body safety, success passthrough.
  - workerService.createWorker delegates to workerApi (resolve + reject); searchWorkers/getWorker regression-confirmed unchanged.
  - WorkerRegistrationPage: non-duplicate banner heading regression lock-in (the Major fix from code review).
  - WorkerRegistrationForm: server-error focus management (email priority, phone fallback, no-op when absent).
  - Full suite (232 tests, 35 files) independently re-verified by orchestrator.
prSummary: |
  Implements SLPTWM-129: replaces the mock worker-registration API with a live POST /api/v1/workers call,
  translating the request/response shape at a new workerApi.ts boundary and reproducing the existing
  duplicate-profile UX from the backend's RFC7807 409 responses. Adds a ProblemDetails-aware response
  interceptor to the shared apiClient, widens Worker/ApiError types additively (createdAt optional, new
  status field), and adds a Vite dev-proxy workaround since the backend currently sends no CORS headers.
  Several facts undocumented in the ticket were resolved by probing the live backend during planning
  (skills are sent as Title-Case labels, not lowercase ids; no createdAt in the response; no auth required
  yet despite the OpenAPI spec declaring it). Code review caught and fixed a banner bug where non-duplicate
  failures (network/400/5xx) incorrectly showed "Profile already exists" instead of a generic failure
  message. 232 tests pass with 97-100% coverage on every changed file.
