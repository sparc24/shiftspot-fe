testPlan: |
  - Zod schema: valid payload + lowercasing; name min/max boundaries; email format; phone regex; location free-text required; age int/min(18)/max(70) boundaries; skills (plumbing/electrical/gardening/carpentry/painting/cleaning) required/unknown-id rejection; whitespace trimming.
  - workerService/mockWorkerApi: successful creation with id/createdAt; independent duplicate-email and duplicate-phone rejection, plus both-at-once; distinct emails succeed independently.
  - useWorkerRegistration: success transition exposing created worker via TanStack Query mutation.
  - WorkerRegistrationForm: empty-submit validation errors; valid submission payload shape; Skills fieldset labelling/aria-describedby; aria-required on all mandatory fields; focus moves to first invalid field; full tab-order keyboard navigation; error clears on correction; server-reported duplicate field errors applied via setError; Cancel navigation.
  - WorkerRegistrationPage: default render; duplicate-error banner + per-field highlighting for email/phone; success message with worker name; submit disabled while pending.
  - Shared components: Button, TextInput, SelectInput, FormField, ErrorAlert, SuccessMessage, MultiSelect, ErrorBoundary - rendering, interaction, accessibility, error states.
  - LandingPage/Router/App: both CTAs (Worker solid, Job Seeker outline) render+navigate to /worker/register and /seeker/search; route matching for /, /worker/register, /seeker/search, plus catch-all; full-app smoke test through ErrorBoundary -> Router -> lazy pages.
  - JobSeekerSearchPage: placeholder renders, link back to landing.
prSummary: |
  Implements SLPTWM-17: a worker self-registration flow for the ShiftSpot job portal, rebuilt to match the actual
  approved design screenshots (Landing Page with both role cards, Worker Registration with sidebar + exact copy).
  Adds a landing page with "Act as a Worker" / "Act as a Job Seeker" CTAs, a client-side-validated (Zod + React Hook
  Form) registration form capturing name/email/phone/location/age/skills (plumbing/electrical/gardening/carpentry/
  painting/cleaning), a mock in-memory worker API/service layer (single swap point for a future live endpoint) with
  independent email and phone duplicate detection, a TanStack Query mutation hook wiring the form to that service,
  and a shared component library built with accessibility as a first-class concern. Routing is set up via React
  Router with lazy-loaded pages (including a /seeker/search placeholder), wrapped in an app-level ErrorBoundary.
  90 tests pass with 100% statement/branch/function/line coverage on every changed file.
