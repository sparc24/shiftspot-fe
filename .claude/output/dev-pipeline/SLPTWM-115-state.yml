feSubtasks:
  - key: "SLPTWM-122"
    summary: "[FE] Implement Worker Search Filter Logic and API Integration"
    status: "To Do"
    description: |
      1. Filter State Management: Track skill selections (array), location (text), age (number); initialize empty/null.
      2. API Integration: On "Find Workers" click, call search endpoint with filters; handle loading/error/success.
      3. Conditional Rendering:
         - No filters applied on mount -> "Start by selecting a skill or location to find workers near you." (AC4)
         - Loading indicator during fetch
         - Zero results -> "No workers found matching your criteria. Try adjusting your filters." (AC3)
         - Results -> worker card grid + result-count text (AC1)
      4. Multi-select Skill Logic (AC2): Manage chip selections from predefined list; OR logic across selected skills.
      5. Data mapping: map API response to card props (avatar, name, location, up to 2 skills).
      6. Optional client-side validation: numeric Age input.
  - key: "SLPTWM-123"
    summary: "[UI] Complete interaction states and responsive design for Worker Search filter and results"
    status: "To Do"
    description: |
      Multi-select skill chips: design focus/hover/active/keyboard states (currently not designed); document keyboard operability/tab order for WCAG 2.2 AA.
      Location and Age input boxes: design focus state (default/filled exist); design error/invalid state.
      Color contrast: verify gold-on-white and placeholder text contrast meets WCAG 2.2 AA; adjust if needed.
      Responsive design: define layout/behavior below 1280px for filter bar, results grid, and empty states.
      Already designed and out of scope here: happy-path grid, multi-select pill pattern, zero-results empty state, first-time-use empty state.

