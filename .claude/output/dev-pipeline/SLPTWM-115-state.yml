testPlan: |
  - Idle/loading/zero-results/results/error states across JobSeekerSearchPage and WorkerSearchResults.
  - Filter bar validation (age/location) and normalisation; skill chip multi-select incl. keyboard (Space toggles).
  - WorkerCard accessibility (role="list", aria-label="Skills") and skill-badge capping to MAX_CARD_SKILLS.
  - mockWorkerApi search matching semantics: skill OR, location case-insensitive substring, age exact, AND across dimensions, empty-filter browse-all.
  - useWorkerSearch hook: disabled-when-null gating, success path, error path.
  - MultiSelect required={false} regression guard so worker-registration's aria-required="true" usage can't silently break.
  - Full suite (136 tests, 24 files) run non-scoped to confirm the new 8-worker seed data doesn't collide with existing worker-registration duplicate-detection tests (plan Q17).
prSummary: |
  Implements SLPTWM-115's FE/UI subtasks (SLPTWM-122, SLPTWM-123): turns the /seeker/search placeholder into a
  working Worker Search screen with skill/location/age filtering. Adds a React Hook Form + Zod filter bar (skill
  chips, Location, Age), a TanStack Query useWorkerSearch hook, and a results view covering all four required
  states (first-use idle, loading, zero-results, results grid with count). Extends the shared mock worker API with
  a searchWorkers function (skill OR-match, location substring, exact age, AND across dimensions) and seed data,
  and fixes a real WCAG 1.4.11 contrast failure in the shared MultiSelect skill-chip component (new amber-dark
  token + check glyph), which also improves the existing Worker Registration screen's chips. Code review caught
  and fixed two accessibility issues in WorkerCard's skill list and a TanStack Query v5 retry-loading-state bug
  before merge. 136 tests pass (99.4% statement / 98.6% branch coverage) with no interference from the new seed
  data on existing registration tests.
