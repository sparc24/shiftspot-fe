testPlan: |
  - Abort-aware getWorkerById: resolves by id, 404s on unknown id, honors already-aborted and mid-flight-aborted signals, unaffected when called without a signal (backward compat for createWorker/searchWorkers).
  - workerService.getWorker delegates id+signal correctly and propagates errors.
  - useWorkerProfile: disabled when no workerId, happy path, 404 error surfacing.
  - WorkerProfilePage: loading/success/not-found are mutually exclusive (including stale-data-coexists-with-404 edge case), generic-error retry, blank-email disabled CTA, back-link target, route param wiring.
  - ContactRow, WorkerContactPanel, ProfileNotFound: rendering, disabled/fallback states, accessible names.
  - toWorkerProfileView: full unsliced skill labels, tel/mailto href normalization, initials derivation.
  - Full suite (179 tests, 31 files) independently re-verified by orchestrator after clearing a stale node_modules/.vite cache.
prSummary: |
  Implements SLPTWM-116's FE/UI subtasks (SLPTWM-126, SLPTWM-127): adds a new Worker Detail screen at
  /seeker/worker/:workerId showing a job seeker the full profile (name, all skills, location, age) and
  a Contact Panel with clickable tel:/mailto: links for a selected worker. Adds an abort-aware
  getWorkerById to the shared mock API and workerService, with AbortSignal cancellation wired through
  useWorkerProfile so an in-flight request is properly cancelled on unmount. An invalid or deleted
  worker id renders a structurally-guaranteed "Profile Not Found" state (the profile components are
  never mounted, not just hidden). WorkerCard is now a full-card <Link> to the detail screen — the only
  way this screen becomes reachable — and its skill-badge markup was extracted into a shared
  SkillChipList reused by both the search card and the new profile header. Code review caught and fixed
  a live-region accessibility bug (loading/success states weren't actually announced to screen readers)
  before merge. Full WCAG 2.2 AA pass on all new interactive elements. 179 tests pass across 31 files.
