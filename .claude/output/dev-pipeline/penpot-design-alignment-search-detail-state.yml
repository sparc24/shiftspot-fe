prSummary: |
  Second pass on design validation against the Penpot file (design.penpot.app, file c828d3cf) covering
  Search Workers, Search Results (Empty State), Worker Detail, and one Landing page bug. First pass
  (already in this PR) fixed missing notch-cut treatment, wrong avatar/icon colors, a missing card
  container on the Worker Detail page, and several copy mismatches. This pass, triggered by user
  feedback that the empty state still didn't match and a Landing button looked wrong, live-rendered the
  actual app via Playwright to catch what code inspection alone missed: the Landing page's outline
  "Act as a Job Seeker" button had a genuinely broken CSS technique (its notch corner never rendered at
  all, reproduced in isolation to confirm root cause), the empty-state heading's font/size didn't match,
  the Search Workers page title had an extra word, and result-card names used the wrong font weight/family.
